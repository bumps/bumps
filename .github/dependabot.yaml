# Set update schedule for GitHub Actions

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "monthly"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      # matches the previous pre-commit.ci autoupdate_schedule
      interval: "monthly"
